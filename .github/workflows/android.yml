name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install current Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          ANDROID_CLI="$HOME/.local/bin/android"
          test -x "$ANDROID_CLI"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "ANDROID_CLI=$ANDROID_CLI" >> "$GITHUB_ENV"
          "$ANDROID_CLI" --no-metrics --version
      - name: Install Android SDK packages
        run: |
          "$ANDROID_CLI" --no-metrics sdk install \
            platform-tools \
            platforms/android-36 \
            build-tools/36.0.0 \
            ndk/30.0.16248370 \
            cmake/3.31.6
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Verify pinned dependencies
        run: |
          echo "621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "05db09a4d3c3c1caa7cda31f98eca6ae28d92eb5"
      - name: Report toolchain
        run: |
          java -version
          ./gradlew --version
          "$ANDROID_HOME/ndk/30.0.16248370/ndk-build" --version
          "$ANDROID_CLI" --no-metrics --version
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon --warning-mode all --stacktrace clean testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: local-llm-reference-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
