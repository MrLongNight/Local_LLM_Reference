name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_CLI_VERSION: "1.1.16919734"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
      - name: Install current Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          ANDROID_CLI="$HOME/.local/bin/android"
          test -x "$ANDROID_CLI"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "ANDROID_CLI=$ANDROID_CLI" >> "$GITHUB_ENV"
      - name: Verify Android CLI version
        run: |
          "$ANDROID_CLI" --no-metrics --version | tee "$RUNNER_TEMP/android-cli-version.txt"
          grep -Fxq "$ANDROID_CLI_VERSION" "$RUNNER_TEMP/android-cli-version.txt"
      - name: Install Vulkan shader build dependencies
        run: sudo apt-get update && sudo apt-get install -y glslc libvulkan-dev spirv-headers
      - name: Install Android SDK packages
        run: |
          "$ANDROID_CLI" --no-metrics sdk install \
            platforms/android-36 \
            build-tools/36.0.0 \
            ndk/30.0.16248370 \
            cmake/3.31.6
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify pinned dependencies
        run: |
          echo "621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "a946eb541a6d3051496bdcc451a0fa85772b8dfd"
      - name: Report toolchain
        run: |
          java -version
          ./gradlew --version
          "$ANDROID_HOME/ndk/30.0.16248370/ndk-build" --version
      - name: Unit tests, Android lint and debug APK
        run: ./gradlew --no-daemon --warning-mode all --stacktrace clean testDebugUnitTest lint assembleDebug
      - name: Verify packaged APK version
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='de.mrlongnight.llmreference' versionCode='145' versionName='0.4.1'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-llm-reference-v145-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
